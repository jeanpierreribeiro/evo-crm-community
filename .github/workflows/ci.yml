name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Seed .env from example
        run: cp .env.example .env

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  lint-dockerfiles:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Lint Auth Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: evo-auth-service-community/Dockerfile
          failure-threshold: error

      - name: Lint CRM Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: evo-ai-crm-community/docker/Dockerfile
          failure-threshold: error

      - name: Lint Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: evo-ai-frontend-community/Dockerfile
          failure-threshold: error

      - name: Lint Processor Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: evo-ai-processor-community/Dockerfile
          failure-threshold: error

      - name: Lint Core Service Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: evo-ai-core-service-community/Dockerfile
          failure-threshold: error

  check-migration-collision:
    name: Check Migration Version Collision (CRM vs auth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run migration collision guard
        run: ./scripts/check_migration_collision.sh

  test-projects-service:
    name: Test Projects Service (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Install dependencies
        working-directory: ./evo-projects-service
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: ./evo-projects-service
        run: pnpm run db:generate

      - name: Run Vitest Suite
        working-directory: ./evo-projects-service
        run: pnpm test
