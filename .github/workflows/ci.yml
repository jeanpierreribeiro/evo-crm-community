name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Seed .env from example
        run: cp .env.example .env

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  lint-dockerfiles:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Lint Auth Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: evo-auth-service-community/Dockerfile
          failure-threshold: error

      - name: Lint CRM Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: evo-ai-crm-community/docker/Dockerfile
          failure-threshold: error

      - name: Lint Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: evo-ai-frontend-community/Dockerfile
          failure-threshold: error

      - name: Lint Processor Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: evo-ai-processor-community/Dockerfile
          failure-threshold: error

      - name: Lint Core Service Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: evo-ai-core-service-community/Dockerfile
          failure-threshold: error

  check-migration-collision:
    name: Check Migration Version Collision (CRM vs auth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run migration collision guard
        run: ./scripts/check_migration_collision.sh

  test-projects-service:
    name: Test Projects Service (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Install dependencies
        working-directory: ./evo-projects-service
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: ./evo-projects-service
        run: pnpm run db:generate

      - name: Run Vitest Suite
        working-directory: ./evo-projects-service
        run: pnpm test

  test-loans-service:
    name: Test Loans Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: evo-loans-service/package-lock.json
      - name: Install dependencies
        working-directory: ./evo-loans-service
        run: npm ci
      - name: Build and unit tests
        working-directory: ./evo-loans-service
        run: npm test
      - name: Disposable PostgreSQL migration and isolation tests
        working-directory: ./evo-loans-service
        run: npm run test:db

  test-loans-frontend:
    name: Test Loans Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: evo-ai-frontend-community/package-lock.json
      - name: Install dependencies
        working-directory: ./evo-ai-frontend-community
        run: npm ci
      - name: Test wallet UI and token retry
        working-directory: ./evo-ai-frontend-community
        run: npm test -- src/pages/loans/LoansWalletsPage.spec.tsx src/pages/loans/LoansClientsPanel.spec.tsx src/pages/loans/LoansAttachments.spec.tsx src/pages/loans/LoansSettingsPanel.spec.tsx src/pages/loans/LoansSimulation.spec.tsx src/pages/loans/LoansDrafts.spec.tsx src/pages/loans/LoansContracts.spec.tsx src/pages/loans/LoansCancellationPreview.spec.tsx src/pages/loans/LoansLoss.spec.tsx src/pages/loans/LoansLossCorrection.spec.tsx src/pages/loans/LoansRecovery.spec.tsx src/pages/loans/LoansAdjustments.spec.tsx src/pages/loans/LoansExtension.spec.tsx src/pages/loans/LoansNegotiation.spec.tsx src/pages/loans/LoansInterestAttribution.spec.tsx src/pages/loans/LoansHistorical.spec.tsx src/pages/loans/LoansInstallments.spec.tsx src/pages/loans/LoansBatchPreview.spec.tsx src/pages/loans/LoansBatchRecovery.spec.tsx src/pages/loans/LoansClientFile.spec.tsx src/services/loans/loansBatchJournal.spec.ts src/services/loans/loansApi.spec.ts src/services/loans/loansConfig.spec.ts src/services/loans/loansBaseUrl.spec.ts
      - name: Build with runtime placeholders
        working-directory: ./evo-ai-frontend-community
        env:
          VITE_LOANS_API_URL: VITE_LOANS_API_URL_PLACEHOLDER
          VITE_LOANS_UI_ENABLED: VITE_LOANS_UI_ENABLED_PLACEHOLDER
        run: |
          npm run build
          grep -q -r 'VITE_LOANS_API_URL_PLACEHOLDER' dist/assets --include='*.js'
          grep -q -r 'VITE_LOANS_UI_ENABLED_PLACEHOLDER' dist/assets --include='*.js'
          node scripts/test-loans-runtime.mjs

  test-loans-auth-integration:
    name: Test Loans and Auth Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: evo-loans-service/package-lock.json
      - name: Build disposable Auth test image
        run: docker build -t jpros-evo-auth:latest ./evo-auth-service-community
      - name: Install loans dependencies
        working-directory: ./evo-loans-service
        run: npm ci
      - name: Test with disposable Auth and PostgreSQL
        working-directory: ./evo-loans-service
        run: npm run test:auth:e2e
